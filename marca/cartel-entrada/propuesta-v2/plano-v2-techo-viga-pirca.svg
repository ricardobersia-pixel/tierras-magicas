ext><text x="1135.0" y="253.75" text-anchor="end" class="n">tejuelas de ciprés</text><text x="40" y="1075" class="n">• Materiales: postes de ciprés o pino impregnado Ø24 (largo 3,67 m) · viga dintel Ø20 × 2,48 m asentada en rebaje y fijada con varilla roscada galvanizada Ø12 a cada poste.</text><text x="40" y="1095" class="n">• Techo a dos aguas 30° (para carga de nieve): cabriadas de 2"×4", entablonado de 1", membrana hidrófuga y tejuelas de ciprés. Montante central y tornapuntas sobre la viga.</text><text x="40" y="1115" class="n">• Pirca: piedra de la zona con mortero (o pirca en seco con piedra grande), 72 × 60 base · 48 × 44 tope · 34 alto, con terminación en pendiente hacia afuera.</text><text x="40" y="1135" class="n">• Iluminación: listón LED cálido 2700–3000 K IP65 bajo la viga + 2 faroles IP65 · cable subterráneo en caño · fotocélula o timer · disyuntor diferencial. Instalación por electricista matriculado.</text><text x="40" y="1155" class="n">• Panel, placa del logo y archivos de CNC y de corte: sin cambios respecto de la versión anterior. Cotas en cm. Verificar en obra las medidas de los troncos.</text></svg>