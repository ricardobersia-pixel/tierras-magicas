cada poste.</text><text x="40" y="1095" class="n">• Viga sin techo: cara superior con chanfle o tapajuntas de chapa prepintada para que escurra el agua; protector UV en todas las piezas y repaso anual.</text><text x="40" y="1115" class="n">• Pirca: piedra de la zona con mortero (o pirca en seco con piedra grande), 72 × 60 base · 48 × 44 tope · 34 alto, con terminación en pendiente hacia afuera.</text><text x="40" y="1135" class="n">• Iluminación: listón LED cálido 2700–3000 K IP65 bajo la viga + 2 faroles IP65 · cable subterráneo en caño · fotocélula o timer · disyuntor diferencial. Instalación por electricista matriculado.</text><text x="40" y="1155" class="n">• Panel, placa del logo y archivos de CNC y de corte: sin cambios respecto de la versión anterior. Cotas en cm. Verificar en obra las medidas de los troncos.</text></svg>