# Taller TM (uso interno): compila el APK de Android. No se publica en GitHub Pages.
# - En cada cambio de taller-sales/: compila el APK (descargable en la ejecución, sección Artifacts).
# - En main: además lo publica en Releases (sin fórmulas: se cargan desde un archivo privado).
name: Taller TM

on:
  push:
    paths:
      - "taller-sales/**"
      - ".github/workflows/taller-sales.yml"
  pull_request:
    paths:
      - "taller-sales/**"
      - ".github/workflows/taller-sales.yml"
  workflow_dispatch:

concurrency:
  group: taller-sales-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: taller-sales
    env:
      TS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taller-sales/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # El runner ya trae el Android SDK (ANDROID_HOME); Gradle descarga las plataformas que falten
      - name: Instalar dependencias y copiar la app web al proyecto Android
        run: |
          npm ci
          npx cap sync android

      # Firma propia opcional: secretos TS_KEYSTORE_BASE64, TS_KEYSTORE_PASSWORD, TS_KEY_ALIAS, TS_KEY_PASSWORD
      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.TS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/taller-sales.jks"
            echo "TS_KEYSTORE=$RUNNER_TEMP/taller-sales.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin clave propia: el APK se firma con la clave de depuración y para actualizarlo hay que desinstalar la versión anterior."
          fi

      - name: Compilar el APK
        env:
          TS_KEYSTORE_PASSWORD: ${{ secrets.TS_KEYSTORE_PASSWORD }}
          TS_KEY_ALIAS: ${{ secrets.TS_KEY_ALIAS }}
          TS_KEY_PASSWORD: ${{ secrets.TS_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/TallerTM.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TallerTM-1.0.${{ github.run_number }}
          path: TallerTM.apk

      # make_latest: false para no cambiar el enlace .../releases/latest/download/PescaPatagonia.apk de Caza&Pesca.
      # Fuera de main se publica como versión de prueba (pre-release).
      - name: Publicar en Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'taller-sales' || 'taller-sales-prueba' }}-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Taller TM 1.0.${{ github.run_number }}${{ github.ref != 'refs/heads/main' && ' (prueba)' || '' }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            APK de Android del Taller TM (producción artesanal de las sales, uso interno). No incluye fórmulas: se cargan desde el archivo privado.
            Para instalarlo: descargá TallerTM.apk desde el teléfono y permití instalar apps de esta fuente.
          files: TallerTM.apk
          make_latest: false

