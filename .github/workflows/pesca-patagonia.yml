# Pesca Patagonia: compila el APK de Android y publica la app web en GitHub Pages.
# - En cada cambio de pesca-patagonia/: compila el APK (descargable en la ejecución, sección Artifacts).
# - En main: además publica el APK en Releases y la app web en GitHub Pages.
name: Pesca Patagonia

on:
  push:
    paths:
      - "pesca-patagonia/**"
      - ".github/workflows/pesca-patagonia.yml"
  pull_request:
    paths:
      - "pesca-patagonia/**"
      - ".github/workflows/pesca-patagonia.yml"
  workflow_dispatch:

concurrency:
  group: pesca-patagonia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pesca-patagonia
    env:
      PP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pesca-patagonia/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # El runner ya trae el Android SDK (ANDROID_HOME); Gradle descarga las plataformas que falten
      - name: Instalar dependencias y copiar la app web al proyecto Android
        run: |
          npm ci
          npx cap sync android

      # Firma propia opcional: secretos PP_KEYSTORE_BASE64, PP_KEYSTORE_PASSWORD, PP_KEY_ALIAS, PP_KEY_PASSWORD
      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.PP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pesca-patagonia.jks"
            echo "PP_KEYSTORE=$RUNNER_TEMP/pesca-patagonia.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin clave propia: el APK se firma con la clave de depuración y para actualizarlo hay que desinstalar la versión anterior."
          fi

      - name: Compilar el APK
        env:
          PP_KEYSTORE_PASSWORD: ${{ secrets.PP_KEYSTORE_PASSWORD }}
          PP_KEY_ALIAS: ${{ secrets.PP_KEY_ALIAS }}
          PP_KEY_PASSWORD: ${{ secrets.PP_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PescaPatagonia.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PescaPatagonia-1.1.${{ github.run_number }}
          path: PescaPatagonia.apk

      # En main queda como la última versión (enlace .../releases/latest/download/PescaPatagonia.apk).
      # Fuera de main se publica como versión de prueba (pre-release) y no cambia ese enlace.
      - name: Publicar en Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'pesca-patagonia' || 'pesca-patagonia-prueba' }}-v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Pesca Patagonia 1.1.${{ github.run_number }}${{ github.ref != 'refs/heads/main' && ' (prueba)' || '' }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            APK de Android de Pesca Patagonia (caza y pesca: tabla solunar y tiempo), presentada por Cabañas Tierras Mágicas.
            Para instalarlo: descargá PescaPatagonia.apk desde el teléfono y permití instalar apps de esta fuente.
          files: PescaPatagonia.apk
          make_latest: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}

  web:
    name: App web (GitHub Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pesca-patagonia/www
      - id: publicar
        uses: actions/deploy-pages@v4
