# Etiquetas autoadhesivas de las Sales Gourmet para el doypack kraft de 10 × 15 cm.
# Cada vez que cambian los PDF ya generados (node sales-gourmet/etiquetas/generar-doypack.cjs),
# los publica en Releases para descargarlos con un enlace permanente.
name: Etiquetas

on:
  push:
    paths:
      - "sales-gourmet/etiquetas/etiquetas_A4_doypack*.pdf"
      - ".github/workflows/etiquetas.yml"
  workflow_dispatch:

concurrency:
  group: etiquetas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar PDF de etiquetas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # make_latest: false para no cambiar el enlace .../releases/latest/download/PescaPatagonia.apk de Caza&Pesca.
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: etiquetas-doypack-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Etiquetas doypack · A4 20 por hoja (v${{ github.run_number }})
          body: |
            Etiqueta única (frente e ingredientes) para el doypack kraft de 10 × 15 cm, en hoja A4 de 4 columnas (una por sal: Caza Patagónica, Bosque Andino, Lago & Trucha, Reserva del Fogón) × 5 filas: 20 etiquetas, 5 de cada sal.

            - **etiquetas_A4_doypack.pdf**: para hoja troquelada.
            - **etiquetas_A4_doypack_con_guias.pdf**: con líneas para cortar a mano.

            Etiqueta de 45,6 × 53,4 mm, márgenes de hoja de 10 mm y 2,5 mm entre etiquetas. Ingredientes en orden alfabético y sin cantidades, contenido de 25 g. Sin fechas ni lote.
            Imprimir al 100%, sin "ajustar a página", a color.
          files: sales-gourmet/etiquetas/etiquetas_A4_doypack*.pdf
          make_latest: false
